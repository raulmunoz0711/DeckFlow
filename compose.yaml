services:
  backend:
    build: ./backend
    environment:
      - JUSTTCG_API_KEY=${JUSTTCG_API_KEY:-}
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./sample_data:/app/public/sample_data:ro
    ports:
      - "5173:5173"
    depends_on:
      - backend
