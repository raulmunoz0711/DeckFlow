services:
  backend:
    build: ./backend
    environment:
      - JUSTTCG_API_KEY=${JUSTTCG_API_KEY:-}
  frontend:
    build: ./frontend
    volumes:
      - ./sample_data:/app/public/sample_data:ro
    depends_on:
      - backend
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:8080"
    depends_on:
      - frontend
      - backend
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://gateway:8080
    depends_on:
      - gateway
